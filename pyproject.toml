[project]
name = "formation-pandas"
version = "1.0.0"
description = "Formation Pandas (2 jours) pour développeurs IA - notebooks, exercices et corrections"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pandas>=3.1",
    "numpy>=2.4",
    "pyarrow>=22",
    "openpyxl>=3.1",
    "lxml>=6",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
